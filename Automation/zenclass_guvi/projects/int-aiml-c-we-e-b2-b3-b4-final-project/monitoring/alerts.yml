groups:
  - name: commentary_sla_alerts
    rules:
      - alert: HighCommentaryLatency
        expr: histogram_quantile(0.95, rate(commentary_agent_latency_seconds_bucket[5m])) > 4.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile commentary latency exceeded 4.0s"
      - alert: PipelineErrorSpike
        expr: increase(commentary_errors_total[5m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Commentary or voice Q&A errors detected"
